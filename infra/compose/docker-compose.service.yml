services:
  scraper:
    build:
      context: ../..
      dockerfile: services/scraper/Dockerfile
    ports:
      - "8080:3000"
  core-api:
    build:
      context: ../..
      dockerfile: services/core-api/Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3000
      - KAFKA_BROKERS=kafka:9092
      - LOG_LEVEL=info
    ports:
      - "8081:3000"
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
    #   interval: 1m30s
    #   timeout: 30s
    #   retries: 3
    logging:
      driver: json-file